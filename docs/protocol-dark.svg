<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E6E8EA"/>
    </marker>
    <marker id="arrAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4CC3D0"/>
    </marker>
  </defs>

  <rect x="20" y="2" width="170" height="458" rx="6" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="310" y="2" width="490" height="458" rx="6" fill="none" stroke="#8B949E" stroke-width="1.5" stroke-dasharray="6 4"/>

  <text x="105" y="18" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="#8B949E">Tinfoil infrastructure</text>
  <text x="555" y="18" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="#8B949E">Customer infrastructure</text>

  <rect x="30" y="26" width="150" height="40" rx="4" fill="none" stroke="#E6E8EA" stroke-width="1.2"/>
  <text x="105" y="43" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E6E8EA">Enclave</text>
  <text x="105" y="58" text-anchor="middle" font-size="10.5" fill="#8B949E">Tinfoil Containers</text>

  <rect x="330" y="26" width="150" height="40" rx="4" fill="none" stroke="#E6E8EA" stroke-width="1.2"/>
  <text x="405" y="43" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E6E8EA">Keyserver</text>
  <text x="405" y="58" text-anchor="middle" font-size="10.5" fill="#8B949E">Customer-run</text>

  <rect x="620" y="26" width="170" height="40" rx="4" fill="none" stroke="#E6E8EA" stroke-width="1.2"/>
  <text x="705" y="43" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E6E8EA">Secret store</text>
  <text x="705" y="58" text-anchor="middle" font-size="10.5" fill="#8B949E">Vault / Secrets Manager</text>

  <line x1="105" y1="66" x2="105" y2="445" stroke="#30363D" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="405" y1="66" x2="405" y2="445" stroke="#30363D" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="705" y1="66" x2="705" y2="445" stroke="#30363D" stroke-width="1" stroke-dasharray="3 4"/>

  <line x1="105" y1="106" x2="398" y2="106" stroke="#E6E8EA" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="255" y="98" text-anchor="middle" font-size="12" fill="#E6E8EA">POST /challenge</text>
  <line x1="405" y1="134" x2="112" y2="134" stroke="#E6E8EA" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="255" y="152" text-anchor="middle" font-size="12" fill="#E6E8EA">Single-use nonce</text>

  <text x="255" y="182" text-anchor="middle" font-size="11.5" fill="#8B949E">Enclave attests over the nonce</text>

  <line x1="105" y1="216" x2="398" y2="216" stroke="#4CC3D0" stroke-width="1.6" marker-end="url(#arrAccent)"/>
  <text x="255" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#4CC3D0">POST /fetch — Attestation document</text>

  <rect x="300" y="240" width="330" height="66" rx="6" fill="#13232A" stroke="#30363D"/>
  <text x="316" y="266" font-size="12" font-weight="600" fill="#E6E8EA">Verify attestation against pinned release</text>
  <text x="316" y="288" font-size="11.5" fill="#8B949E">Any check fails → 403, nothing released</text>

  <line x1="405" y1="336" x2="698" y2="336" stroke="#E6E8EA" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="555" y="328" text-anchor="middle" font-size="12" fill="#E6E8EA">Read approved secrets</text>
  <line x1="705" y1="364" x2="412" y2="364" stroke="#E6E8EA" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="555" y="382" text-anchor="middle" font-size="12" fill="#E6E8EA">Values</text>

  <line x1="405" y1="418" x2="112" y2="418" stroke="#4CC3D0" stroke-width="1.6" marker-end="url(#arrAccent)"/>
  <text x="255" y="404" text-anchor="middle" font-size="12" font-weight="600" fill="#4CC3D0">Secrets → injected as environment variables</text>
</svg>
