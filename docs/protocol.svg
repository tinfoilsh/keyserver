<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 710" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#24292E"/>
    </marker>
    <marker id="arrAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E7D8A"/>
    </marker>
  </defs>

  <text x="105" y="16" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="#57606A">TINFOIL-HOSTED TEE</text>
  <text x="550" y="16" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="#57606A">CUSTOMER INFRASTRUCTURE</text>

  <rect x="30" y="26" width="150" height="40" rx="4" fill="none" stroke="#24292E" stroke-width="1.2"/>
  <text x="105" y="43" text-anchor="middle" font-size="12.5" font-weight="600" fill="#24292E">Enclave</text>
  <text x="105" y="58" text-anchor="middle" font-size="10.5" fill="#57606A">Tinfoil Containers</text>

  <rect x="330" y="26" width="150" height="40" rx="4" fill="none" stroke="#24292E" stroke-width="1.2"/>
  <text x="405" y="43" text-anchor="middle" font-size="12.5" font-weight="600" fill="#24292E">Keyserver</text>
  <text x="405" y="58" text-anchor="middle" font-size="10.5" fill="#57606A">customer-run</text>

  <rect x="620" y="26" width="170" height="40" rx="4" fill="none" stroke="#24292E" stroke-width="1.2"/>
  <text x="705" y="43" text-anchor="middle" font-size="12.5" font-weight="600" fill="#24292E">Secret store</text>
  <text x="705" y="58" text-anchor="middle" font-size="10.5" fill="#57606A">Vault / Secrets Manager</text>

  <line x1="105" y1="66" x2="105" y2="685" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="405" y1="66" x2="405" y2="685" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="705" y1="66" x2="705" y2="685" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="3 4"/>

  <text x="30" y="96" font-size="10.5" letter-spacing="1" fill="#57606A">EVERY ENCLAVE BOOT</text>

  <line x1="105" y1="122" x2="398" y2="122" stroke="#24292E" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="255" y="114" text-anchor="middle" font-size="12" fill="#24292E">POST /challenge</text>
  <line x1="405" y1="150" x2="112" y2="150" stroke="#24292E" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="255" y="168" text-anchor="middle" font-size="12" fill="#24292E">nonce — single-use, short-lived</text>

  <text x="255" y="198" text-anchor="middle" font-size="11.5" fill="#57606A">enclave builds a fresh v3 attestation document over the nonce:</text>
  <text x="255" y="214" text-anchor="middle" font-size="11.5" fill="#57606A">endorsed TLS key + GPU evidence + embedded Sigstore &amp; vendor collateral</text>

  <line x1="105" y1="248" x2="398" y2="248" stroke="#0E7D8A" stroke-width="1.6" marker-end="url(#arrAccent)"/>
  <text x="255" y="234" text-anchor="middle" font-size="12" font-weight="600" fill="#0E7D8A">POST /fetch — mutual TLS</text>
  <text x="255" y="266" text-anchor="middle" font-size="11" font-family="Courier, monospace" fill="#57606A">{repo, secret_refs, nonce, document}</text>

  <rect x="300" y="288" width="330" height="240" rx="6" fill="rgba(14,125,138,0.08)" stroke="#D0D7DE"/>
  <text x="316" y="314" font-size="12" font-weight="600" fill="#24292E">release gate — all five must pass</text>

  <text x="316" y="342" font-size="12" fill="#0E7D8A" font-family="Courier, monospace">1</text>
  <text x="334" y="342" font-size="12" fill="#24292E">nonce was issued, unexpired, unused</text>
  <text x="316" y="368" font-size="12" fill="#0E7D8A" font-family="Courier, monospace">2</text>
  <text x="334" y="368" font-size="12" fill="#24292E">document verifies offline: quote to AMD / Intel</text>
  <text x="334" y="384" font-size="12" fill="#24292E">roots, Sigstore release of pinned repo, debug off</text>
  <text x="316" y="410" font-size="12" fill="#0E7D8A" font-family="Courier, monospace">3</text>
  <text x="334" y="410" font-size="12" fill="#24292E">authenticated release tag = pinned tag</text>
  <text x="316" y="436" font-size="12" fill="#0E7D8A" font-family="Courier, monospace">4</text>
  <text x="334" y="436" font-size="12" fill="#24292E">caller's TLS key = key endorsed in document</text>
  <text x="316" y="462" font-size="12" fill="#0E7D8A" font-family="Courier, monospace">5</text>
  <text x="334" y="462" font-size="12" fill="#24292E">caller's cert CA-issued for pinned domain</text>

  <line x1="316" y1="482" x2="614" y2="482" stroke="#D0D7DE" stroke-width="1"/>
  <text x="316" y="506" font-size="11.5" fill="#57606A">any failure → 403, nothing released</text>

  <line x1="405" y1="556" x2="698" y2="556" stroke="#24292E" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="555" y="548" text-anchor="middle" font-size="12" fill="#24292E">read only the approved secrets</text>
  <line x1="705" y1="584" x2="412" y2="584" stroke="#24292E" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="555" y="602" text-anchor="middle" font-size="12" fill="#24292E">values</text>

  <line x1="405" y1="638" x2="112" y2="638" stroke="#0E7D8A" stroke-width="1.6" marker-end="url(#arrAccent)"/>
  <text x="255" y="624" text-anchor="middle" font-size="12" font-weight="600" fill="#0E7D8A">{NAME: value} — key-bound channel</text>

  <text x="105" y="672" text-anchor="middle" font-size="11.5" fill="#57606A">injected as container env vars,</text>
  <text x="105" y="688" text-anchor="middle" font-size="11.5" fill="#57606A">only ever in enclave memory</text>
</svg>
